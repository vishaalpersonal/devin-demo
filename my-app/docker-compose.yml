services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsconsole
    ports:
      # 5433 on the host to avoid colliding with a natively installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsconsole"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
